{layout name="layout1" /}
<style>
    /* === 左侧主题选择区 === */
    .theme-layout { display: flex; gap: 24px; align-items: flex-start; }
    .theme-config-pane { flex: 1; min-width: 0; }
    .theme-preview-pane { flex: 0 0 400px; position: sticky; top: 16px; }

    .theme-presets { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 0; }
    .theme-card {
        border: 2px solid #e6e6e6; border-radius: 8px; padding: 12px;
        width: calc(50% - 8px); cursor: pointer; transition: all .2s;
        background: #fff; position: relative;
    }
    .theme-card:hover { border-color: #1E9FFF; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .theme-card.active { border-color: #FF5722; background: #fff8f6; }
    .theme-card.active::after {
        content: '✓'; position: absolute; top: 6px; right: 10px;
        color: #FF5722; font-size: 18px; font-weight: bold;
    }
    .theme-swatch { display: flex; height: 28px; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
    .theme-swatch-primary { flex: 2; }
    .theme-swatch-secondary { flex: 1; }
    .theme-name { font-weight: 600; margin-bottom: 4px; color: #333; font-size: 13px; }
    .theme-desc { font-size: 11px; color: #999; line-height: 1.5; }
    .custom-color-block { padding: 12px 0; }
    .custom-color-block input[type=color] { vertical-align: middle; width: 60px; height: 32px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; padding: 0; }
    .custom-color-block .color-hex { display: inline-block; margin-left: 8px; vertical-align: middle; font-family: monospace; }

    /* === 右侧预览手机框 === */
    .preview-frame {
        background: #1a1a1a; border-radius: 32px; padding: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,.15);
    }
    .preview-screen {
        position: relative; width: 376px; height: 720px;
        border-radius: 24px; overflow: hidden; background: #fff;
    }
    .preview-screen iframe {
        width: 100%; height: 100%; border: 0; display: block;
    }
    .preview-label {
        text-align: center; color: #666; font-size: 12px; margin-top: 8px;
    }
    .preview-loader {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(255,255,255,.85); z-index: 1; transition: opacity .2s;
        pointer-events: none;
    }
    .preview-loader.hidden { opacity: 0; }
</style>

<div class="layui-fluid">
  <div class="layui-card">
    <div class="layui-card-body">
      <div class="layui-collapse like-layui-collapse" lay-accordion="" style="border:1px dashed #c4c4c4">
        <div class="layui-colla-item">
          <h2 class="layui-colla-title like-layui-colla-title" style="background-color: #fff">操作提示</h2>
          <div class="layui-colla-content layui-show">
            <p>*点击左侧任意主题,**右侧手机框立即预览效果**(不会保存)。</p>
            <p>*确认满意后点「保存设置」,所有用户下次打开 H5 就看到新主题。</p>
            <p>*不同主题除了**颜色不同**,还有**圆角风格、密度、营销板块的显示**等差异。</p>
            <p>*药品零售主题会自动隐藏砍价/抽奖等娱乐板块,极简主题会隐藏所有营销板块。</p>
          </div>
        </div>
      </div>
    </div>

    <div class="layui-form layui-card-header layuiadmin-card-header-auto">
      <h1 class="site-h1">主题设置</h1>
    </div>

    <div class="layui-card-body">
      <div class="theme-layout">
        <div class="theme-config-pane">
          <form class="layui-form" lay-filter="theme-form">

            <div class="layui-form-item">
              <fieldset class="layui-elem-field layui-field-title">
                <legend>选择主题</legend>
              </fieldset>
            </div>

            <div class="layui-form-item">
              <div class="theme-presets" id="presets-grid">
                {volist name="presets" id="p" key="k"}
                  <label class="theme-card {if condition="$config.preset eq $k"}active{/if}" data-preset="{$k}">
                    <input type="radio" name="preset" value="{$k}" style="display:none" {if condition="$config.preset eq $k"}checked{/if}>
                    <div class="theme-swatch">
                      <div class="theme-swatch-primary" style="background:{$p.primary}"></div>
                      <div class="theme-swatch-secondary" style="background:{$p.secondary}"></div>
                    </div>
                    <div class="theme-name">{$p.name}</div>
                    <div class="theme-desc">{$p.desc}</div>
                  </label>
                {/volist}
                <label class="theme-card {if condition="$config.preset eq 'custom'"}active{/if}" data-preset="custom">
                  <input type="radio" name="preset" value="custom" style="display:none" {if condition="$config.preset eq 'custom'"}checked{/if}>
                  <div class="theme-swatch">
                    <div class="theme-swatch-primary" style="background:#999"></div>
                    <div class="theme-swatch-secondary" style="background:#ccc"></div>
                  </div>
                  <div class="theme-name">🎨 自定义</div>
                  <div class="theme-desc">自己挑主色+辅助色,适合已有品牌 VI 配色规范的商家</div>
                </label>
              </div>
            </div>

            <div class="layui-form-item custom-color-block" id="custom-color-block" style="display:{if condition="$config.preset eq 'custom'"}block{else /}none{/if}">
              <label class="layui-form-label">主色:</label>
              <div class="layui-input-inline">
                <input type="color" id="primary_color_picker" value="{$config.primary_color}">
                <input type="text" name="primary_color" id="primary_color_text" class="layui-input color-hex" value="{$config.primary_color}" style="width:100px;display:inline-block;" maxlength="7">
              </div>
              <label class="layui-form-label">辅助色:</label>
              <div class="layui-input-inline">
                <input type="color" id="secondary_color_picker" value="{$config.secondary_color}">
                <input type="text" name="secondary_color" id="secondary_color_text" class="layui-input color-hex" value="{$config.secondary_color}" style="width:100px;display:inline-block;" maxlength="7">
              </div>
            </div>

            <div class="layui-form-item">
              <fieldset class="layui-elem-field layui-field-title">
                <legend>应用范围</legend>
              </fieldset>
            </div>

            <div class="layui-form-item">
              <label class="layui-form-label">H5 商城:</label>
              <div class="layui-input-block">
                <input type="radio" name="apply_h5" value="1" title="启用" {if condition="$config.apply_h5 eq 1"}checked{/if}>
                <input type="radio" name="apply_h5" value="0" title="不启用(用原始 LikeShop 红)" {if condition="$config.apply_h5 eq 0"}checked{/if}>
              </div>
            </div>

            <div class="layui-form-item">
              <label class="layui-form-label">后台 UI:</label>
              <div class="layui-input-block">
                <input type="radio" name="apply_admin" value="1" title="启用(顶部导航变色)" {if condition="$config.apply_admin eq 1"}checked{/if}>
                <input type="radio" name="apply_admin" value="0" title="不启用" {if condition="$config.apply_admin eq 0"}checked{/if}>
              </div>
            </div>

            <div class="layui-form-item">
              <div class="layui-input-block">
                <button class="layui-btn {$view_theme_color}" lay-submit lay-filter="theme-submit">保存设置</button>
                <a class="layui-btn layui-btn-primary" id="refresh-preview" href="javascript:;">刷新预览</a>
              </div>
            </div>
          </form>
        </div>

        <div class="theme-preview-pane">
          <div class="preview-frame">
            <div class="preview-screen">
              <div class="preview-loader" id="preview-loader">加载中…</div>
              <iframe id="preview-iframe" src="/mobile/?theme_preview={$config.preset}"></iframe>
            </div>
          </div>
          <div class="preview-label">📱 H5 商城实时预览 (376×720)</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  layui.config({
    version: "{$front_version}",
    base: '/static/plug/layui-admin/dist/layuiadmin/'
  }).extend({
    index: 'lib/index'
  }).use(['index', 'form', 'like'], function() {
    var $ = layui.$,
        form = layui.form,
        like = layui.like;

    var $iframe = $('#preview-iframe');
    var $loader = $('#preview-loader');

    function updatePreview(preset) {
      $loader.removeClass('hidden');
      $iframe.attr('src', '/mobile/?theme_preview=' + encodeURIComponent(preset || 'default') + '&_t=' + Date.now());
    }
    $iframe.on('load', function() {
      $loader.addClass('hidden');
    });

    // 卡片点击: 高亮 + 触发预览
    $('#presets-grid').on('click', '.theme-card', function() {
      $('#presets-grid .theme-card').removeClass('active');
      $(this).addClass('active');
      $(this).find('input[type=radio]').prop('checked', true);
      var preset = $(this).data('preset');
      $('#custom-color-block').toggle(preset === 'custom');
      if (preset !== 'custom') {
        updatePreview(preset);
      }
    });

    // 颜色 picker <-> 文本同步, 自定义模式下也触发预览
    function bindColor(picker, text) {
      $(picker).on('input change', function() { $(text).val($(this).val().toUpperCase()); });
      $(text).on('input change', function() {
        var v = $(this).val();
        if (/^#[0-9a-f]{6}$/i.test(v)) $(picker).val(v);
      });
    }
    bindColor('#primary_color_picker', '#primary_color_text');
    bindColor('#secondary_color_picker', '#secondary_color_text');

    // 手动刷新预览按钮
    $('#refresh-preview').on('click', function() {
      var preset = $('input[name=preset]:checked').val() || 'default';
      updatePreview(preset);
    });

    form.on('submit(theme-submit)', function(data) {
      like.ajax({
        url: '{:url("ThemeSetting/index")}',
        data: data.field,
        type: 'post',
        success: function(res) {
          layer.msg(res.msg, { offset: '15px', icon: 1, time: 1500 }, function() {
            location.href = location.href;
          });
        }
      });
      return false;
    });
  });
</script>
